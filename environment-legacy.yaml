# NCCR Genomics Pipeline - Legacy Environment
# For users who want to stay on the old versions
# This file preserves the original working configuration
#
# Usage:
#   conda env create -f environment-legacy.yaml
#   conda activate nccrPipe
#   pip install -e .

name: nccrPipe
channels:
  - defaults
  - bioconda
  - conda-forge
dependencies:
  - python==3.8.*
  - snakemake>=7.1.*,<8.0
  - pyaml
  - click
  - pandas
