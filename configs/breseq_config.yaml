projectName: MyProject

# Input/output paths
dataDir: /nfs/cds-peta/exports/biol_micro_cds_gr_sunagawa/scratch/Projects_NCCR/soft/NCCR_genomicsPipeline/tests/test_data
outDir: /nfs/cds-peta/exports/biol_micro_cds_gr_sunagawa/scratch/Projects_NCCR/soft/NCCR_genomicsPipeline/tests/output
samples: /nfs/cds-peta/exports/biol_micro_cds_gr_sunagawa/scratch/Projects_NCCR/soft/NCCR_genomicsPipeline/tests/test_data/samples.csv   # CSV with columns: sample, unit, fastq_1, fastq_2

# Sample specs
fq_fwd: _1.fq.gz   # Forward read filename suffix
fq_rvr: _2.fq.gz   # Reverse read filename suffix
se: false

# Sample name sanitisation (used by 'nccrPipe samples' to derive sample names from filenames)
# e.g. Sample1_LIBXXX_R1.fq.gz with delimiter '_' and index 1 -> sample name 'Sample1'
sanitise_name: false
name_delimiter: _
name_index: 1

# Preprocessing (required before breseq)
qc: yes
mink: 11
trimq: 14
mapq: 20
minlen: 45
merge_replicates: false

# Adapter/PhiX references for preprocessing
# Standard parameters. Dont change these!!!
adapters: '/nfs/cds-shini.ethz.ch/exports/biol_micro_cds_gr_sunagawa/SequenceStorage/resources/adapters.fa'
phix: '/nfs/cds-shini.ethz.ch/exports/biol_micro_cds_gr_sunagawa/SequenceStorage/resources/phix174_ill.ref.fa.gz'
bbmap_human_ref: '/nfs/cds-shini.ethz.ch/exports/biol_micro_cds_gr_sunagawa/SequenceStorage/resources/human_bbmap_ref/'
bbmap_mouse_ref: '/nfs/cds-shini.ethz.ch/exports/biol_micro_cds_gr_sunagawa/SequenceStorage/resources/mouse_bbmap_ref/'


# Reference genome
reference:
  refgbk: /path/to/reference.gbk   # GenBank (.gbk) file — required for breseq
  refgff: ''                        # Optional: separate GFF annotation; leave empty to use only refgbk

# Breseq options
breseq:
  polymorphic: true    # true = polymorphic mode (-p); false = clonal/consensus mode
  limit_fold_coverage: 200     # -l: downsample reads above this fold-coverage; remove or set to null to use breseq default
  min_mapping_quality: 30      # -m: minimum mapping quality to use a read; remove or set to null to use breseq default
