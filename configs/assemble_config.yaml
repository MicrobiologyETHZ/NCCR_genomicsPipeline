projectName: MyAssembly

# Input/output paths
# All paths are relative to the workflow/ directory (where snakemake runs).
# Use ../ to reference files in the repo root.
dataDir: ../tests/test_data
outDir: ../tests/output
samples: ../tests/test_data/samples.csv   # CSV with columns: sample, unit, fastq_1, fastq_2

# Sample specs
fq_fwd: _1.fq.gz   # Forward read filename suffix
fq_rvr: _2.fq.gz   # Reverse read filename suffix
se: false

# Sample name sanitisation (used by 'nccrPipe samples' to derive sample names from filenames)
# e.g. Sample1_LIBXXX_R1.fq.gz with delimiter '_' and index 1 -> sample name 'Sample1'
sanitise_name: false
name_delimiter: _
name_index: 1

# Preprocessing (required before breseq)
qc: yes
mink: 11
trimq: 14
mapq: 20
minlen: 45
merge_replicates: false

# Adapter/PhiX references for preprocessing (bundled in the repo)
adapters: ../data/adapters/adapters.fa
phix: ../data/adapters/phix174_ill.ref.fa.gz
# Host decontamination — only needed if removing human/mouse reads; leave unset otherwise
# bbmap_human_ref: /path/to/human_bbmap_ref/
# bbmap_mouse_ref: /path/to/mouse_bbmap_ref/


# Reference genome
reference:
  refgbk: ../tests/test_data/ref.gbk   # GenBank (.gbk) file — required for breseq
  refgff: ''                        # Optional: separate GFF annotation; leave empty to use only refgbk

# Assembler options

assembler: unicycler